name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
        env:
          MONGO_URI: mongodb://localhost:27017/test
          JWT_ACCESS_SECRET: ci-access-secret-at-least-16-chars-long
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-16-chars-long
